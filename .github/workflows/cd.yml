# .github/workflows/cd.yml
name: CD - Continuous Deployment

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: "Validation Environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:

  # ==========================================================
  # 🚀 STAGING / MAIN BUILD
  # ==========================================================
  deploy-staging:
    name: 🚀 Build & Validate Staging Images
    runs-on: ubuntu-latest

    if: github.event_name == 'push' || github.event.inputs.environment == 'staging'

    permissions:
      contents: read
      packages: write

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------------
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # GitHub Container Registry Login
      # --------------------------------------------------------
      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # Build & Push RAG
      # --------------------------------------------------------
      - name: 🏗️ Build & Push RAG Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile.rag
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-rag:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-rag:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------
      # Build & Push API
      # --------------------------------------------------------
      - name: 🏗️ Build & Push API Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------
      # Build & Push Frontend
      # --------------------------------------------------------
      - name: 🏗️ Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------
      # Deployment Summary
      # --------------------------------------------------------
      - name: 📋 Deployment Summary
        run: |
          echo "============================================================"
          echo "🚀 STAGING BUILD COMPLETED"
          echo "============================================================"

          echo ""
          echo "📦 Docker Images:"
          echo "   RAG:"
          echo "   ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-rag:staging"

          echo ""
          echo "   API:"
          echo "   ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:staging"

          echo ""
          echo "   Frontend:"
          echo "   ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:staging"

          echo ""
          echo "🏷️ Commit:"
          echo "   ${{ github.sha }}"

          echo ""
          echo "============================================================"
          echo "✅ CD PIPELINE PASSED"
          echo "============================================================"


  # ==========================================================
  # 🚀 PRODUCTION BUILD
  # ==========================================================
  deploy-production:
    name: 🚀 Build & Validate Production Images
    runs-on: ubuntu-latest

    if: github.event.inputs.environment == 'production'

    needs: deploy-staging

    permissions:
      contents: read
      packages: write

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------------
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # GitHub Container Registry Login
      # --------------------------------------------------------
      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # Build & Push RAG
      # --------------------------------------------------------
      - name: 🏗️ Build & Push RAG Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile.rag
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-rag:production
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-rag:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------
      # Build & Push API
      # --------------------------------------------------------
      - name: 🏗️ Build & Push API Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:production
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------
      # Build & Push Frontend
      # --------------------------------------------------------
      - name: 🏗️ Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:production
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------
      # Production Summary
      # --------------------------------------------------------
      - name: 📋 Production Summary
        run: |
          echo "============================================================"
          echo "🚀 PRODUCTION BUILD COMPLETED"
          echo "============================================================"

          echo ""
          echo "📦 Docker Images:"

          echo "   RAG:"
          echo "   ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-rag:production"

          echo ""
          echo "   API:"
          echo "   ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:production"

          echo ""
          echo "   Frontend:"
          echo "   ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:production"

          echo ""
          echo "🏷️ Commit:"
          echo "   ${{ github.sha }}"

          echo ""
          echo "============================================================"
          echo "✅ PRODUCTION BUILD PIPELINE PASSED"
          echo "============================================================"
