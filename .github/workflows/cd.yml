# .github/workflows/cd.yml
name: CD - Continuous Deployment

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment Environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: customer-support-ai

jobs:

  # ==========================================================
  # 🚀 STAGING DEPLOYMENT
  # ==========================================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest

    if: github.event_name == 'push' || github.event.inputs.environment == 'staging'

    environment: staging

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # AWS Authentication
      # --------------------------------------------------------
      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # ECR Login
      # --------------------------------------------------------
      - name: 🔑 Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # Build & Push Images
      # --------------------------------------------------------
      - name: 🏗️ Build and Push Images to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: staging
        run: |
          set -e

          echo "============================================================"
          echo "🐳 BUILDING STAGING IMAGES"
          echo "============================================================"

          # ----------------------------------------------------
          # RAG
          # ----------------------------------------------------
          echo ""
          echo "🔹 Building RAG image..."

          docker build \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}-rag:$IMAGE_TAG \
            -f backend/docker/Dockerfile.rag \
            ./backend

          docker push \
            $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}-rag:$IMAGE_TAG

          # ----------------------------------------------------
          # API
          # ----------------------------------------------------
          echo ""
          echo "🔹 Building API image..."

          docker build \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}-api:$IMAGE_TAG \
            -f backend/docker/Dockerfile.backend \
            ./backend

          docker push \
            $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}-api:$IMAGE_TAG

          # ----------------------------------------------------
          # Frontend
          # ----------------------------------------------------
          echo ""
          echo "🔹 Building Frontend image..."

          docker build \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}-frontend:$IMAGE_TAG \
            -f frontend/Dockerfile.frontend \
            ./frontend

          docker push \
            $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}-frontend:$IMAGE_TAG

          echo ""
          echo "============================================================"
          echo "✅ ALL STAGING IMAGES PUSHED SUCCESSFULLY"
          echo "============================================================"

      # --------------------------------------------------------
      # Deploy to Staging Server
      # --------------------------------------------------------
      - name: 🚀 Deploy to Staging Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e

            cd /app/customer-support-ai

            echo "============================================================"
            echo "🚀 DEPLOYING STAGING"
            echo "============================================================"

            echo ""
            echo "🔑 Logging in to Amazon ECR..."

            aws ecr get-login-password --region us-east-1 | \
              docker login \
              --username AWS \
              --password-stdin \
              $(aws sts get-caller-identity \
                --query Account \
                --output text).dkr.ecr.us-east-1.amazonaws.com

            echo ""
            echo "📥 Pulling latest staging images..."

            export ECR_REGISTRY=$(aws sts get-caller-identity \
              --query Account \
              --output text).dkr.ecr.us-east-1.amazonaws.com

            export IMAGE_TAG=staging

            docker compose pull

            echo ""
            echo "🔄 Restarting services..."

            docker compose up -d --force-recreate --remove-orphans

            echo ""
            echo "🧹 Cleaning unused Docker resources..."

            docker system prune -f

            echo ""
            echo "============================================================"
            echo "✅ STAGING DEPLOYMENT COMPLETED"
            echo "============================================================"

      # --------------------------------------------------------
      # Staging Health Check
      # --------------------------------------------------------
      - name: 🩺 Staging Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e

            echo "============================================================"
            echo "🩺 STAGING HEALTH CHECK"
            echo "============================================================"

            echo ""
            echo "🔹 Checking RAG service..."

            curl -f http://localhost:8001/health

            echo ""
            echo "🔹 Checking API service..."

            curl -f http://localhost:8000/health

            echo ""
            echo "🔹 Checking running containers..."

            docker compose ps

            echo ""
            echo "============================================================"
            echo "✅ STAGING HEALTH CHECK PASSED"
            echo "============================================================"


  # ==========================================================
  # 🚀 PRODUCTION DEPLOYMENT
  # ==========================================================
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest

    if: github.event.inputs.environment == 'production'

    environment: production

    needs: deploy-staging

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # AWS Authentication
      # --------------------------------------------------------
      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # ECR Login
      # --------------------------------------------------------
      - name: 🔑 Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # Build & Push Production Images
      # --------------------------------------------------------
      - name: 🏗️ Build and Push Images to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: production
        run: |
          set -e

          echo "============================================================"
          echo "🐳 BUILDING PRODUCTION IMAGES"
          echo "============================================================"

          # ----------------------------------------------------
          # RAG
          # ----------------------------------------------------
          echo ""
          echo "🔹 Building RAG image..."

          docker build \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}-rag:$IMAGE_TAG \
            -f backend/docker/Dockerfile.rag \
            ./backend

          docker push \
            $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}-rag:$IMAGE_TAG

          # ----------------------------------------------------
          # API
          # ----------------------------------------------------
          echo ""
          echo "🔹 Building API image..."

          docker build \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}-api:$IMAGE_TAG \
            -f backend/docker/Dockerfile.backend \
            ./backend

          docker push \
            $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}-api:$IMAGE_TAG

          # ----------------------------------------------------
          # Frontend
          # ----------------------------------------------------
          echo ""
          echo "🔹 Building Frontend image..."

          docker build \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}-frontend:$IMAGE_TAG \
            -f frontend/Dockerfile.frontend \
            ./frontend

          docker push \
            $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}-frontend:$IMAGE_TAG

          echo ""
          echo "============================================================"
          echo "✅ ALL PRODUCTION IMAGES PUSHED SUCCESSFULLY"
          echo "============================================================"

      # --------------------------------------------------------
      # Deploy to Production Server
      # --------------------------------------------------------
      - name: 🚀 Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e

            cd /app/customer-support-ai

            echo "============================================================"
            echo "🚀 DEPLOYING PRODUCTION"
            echo "============================================================"

            echo ""
            echo "🔑 Logging in to Amazon ECR..."

            aws ecr get-login-password --region us-east-1 | \
              docker login \
              --username AWS \
              --password-stdin \
              $(aws sts get-caller-identity \
                --query Account \
                --output text).dkr.ecr.us-east-1.amazonaws.com

            echo ""
            echo "📥 Pulling production images..."

            export ECR_REGISTRY=$(aws sts get-caller-identity \
              --query Account \
              --output text).dkr.ecr.us-east-1.amazonaws.com

            export IMAGE_TAG=production

            docker compose pull

            echo ""
            echo "🔄 Restarting services..."

            docker compose up -d --force-recreate --remove-orphans

            echo ""
            echo "🧹 Cleaning unused Docker resources..."

            docker system prune -f

            echo ""
            echo "============================================================"
            echo "✅ PRODUCTION DEPLOYMENT COMPLETED"
            echo "============================================================"

      # --------------------------------------------------------
      # Production Health Check
      # --------------------------------------------------------
      - name: 🩺 Production Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e

            echo "============================================================"
            echo "🩺 PRODUCTION HEALTH CHECK"
            echo "============================================================"

            echo ""
            echo "🔹 Checking RAG service..."

            curl -f http://localhost:8001/health

            echo ""
            echo "🔹 Checking API service..."

            curl -f http://localhost:8000/health

            echo ""
            echo "🔹 Checking running containers..."

            docker compose ps

            echo ""
            echo "============================================================"
            echo "✅ PRODUCTION HEALTH CHECK PASSED"
            echo "============================================================"
