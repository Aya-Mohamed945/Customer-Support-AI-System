name: Security Scan

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:

  # ==========================================================
  # Dependency Scan
  # ==========================================================
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Python Dependencies
      # --------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit
        id: pip-audit
        run: |
          set +e

          pip-audit \
            -r backend/requirements.txt \
            --desc \
            --format json \
            --output pip-audit-report.json

          AUDIT_EXIT=$?

          echo "pip_audit_exit=$AUDIT_EXIT" >> "$GITHUB_OUTPUT"

          if [ "$AUDIT_EXIT" -ne 0 ]; then
            echo "❌ pip-audit detected vulnerabilities."
          else
            echo "✅ pip-audit found no known vulnerabilities."
          fi

          exit 0

      - name: Analyze pip-audit results
        id: pip-analysis
        run: |
          if [ ! -f pip-audit-report.json ]; then
            echo "❌ pip-audit report was not generated."
            echo "pip_status=fail" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VULN_COUNT=$(jq '[.dependencies[]?.vulns[]?] | length' pip-audit-report.json 2>/dev/null || echo "0")

          echo "Python vulnerabilities found: $VULN_COUNT"

          if [ "$VULN_COUNT" -gt 0 ]; then
            echo "❌ Python dependency vulnerabilities detected."
            echo "pip_status=fail" >> "$GITHUB_OUTPUT"
          else
            echo "✅ No Python dependency vulnerabilities detected."
            echo "pip_status=pass" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          if-no-files-found: warn

      # --------------------------------------------------------
      # Node.js Dependencies
      # --------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        id: npm-audit
        working-directory: frontend
        run: |
          npm audit \
            --production \
            --audit-level=moderate \
            --json > npm-audit-report.json 2>/dev/null || true

      - name: Analyze npm audit results
        id: npm-analysis
        working-directory: frontend
        run: |
          if [ ! -f npm-audit-report.json ]; then
            echo "❌ npm audit report was not generated."
            echo "npm_status=fail" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CRITICAL_COUNT=$(jq -r '.metadata.vulnerabilities.critical // 0' npm-audit-report.json)
          HIGH_COUNT=$(jq -r '.metadata.vulnerabilities.high // 0' npm-audit-report.json)
          MODERATE_COUNT=$(jq -r '.metadata.vulnerabilities.moderate // 0' npm-audit-report.json)

          echo "npm audit results:"
          echo "  Critical: $CRITICAL_COUNT"
          echo "  High:     $HIGH_COUNT"
          echo "  Moderate: $MODERATE_COUNT"

          if [ "$CRITICAL_COUNT" -gt 0 ] || \
             [ "$HIGH_COUNT" -gt 0 ] || \
             [ "$MODERATE_COUNT" -gt 0 ]; then

            echo "❌ CRITICAL/HIGH/MODERATE npm vulnerabilities detected."
            echo "npm_status=fail" >> "$GITHUB_OUTPUT"
          else
            echo "✅ No CRITICAL/HIGH/MODERATE npm vulnerabilities detected."
            echo "npm_status=pass" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json
          if-no-files-found: warn

      # --------------------------------------------------------
      # Dependency Security Gate
      # --------------------------------------------------------
      - name: Dependency Security Gate
        if: always()
        run: |
          PIP_STATUS="${{ steps.pip-analysis.outputs.pip_status }}"
          NPM_STATUS="${{ steps.npm-analysis.outputs.npm_status }}"

          echo "========================================"
          echo "Dependency Security Gate"
          echo "========================================"
          echo "pip-audit: $PIP_STATUS"
          echo "npm audit: $NPM_STATUS"
          echo "========================================"

          if [ "$PIP_STATUS" = "fail" ] || [ "$NPM_STATUS" = "fail" ]; then
            echo "❌ Dependency security gate failed."
            exit 1
          fi

          echo "✅ Dependency security gate passed."


  # ==========================================================
  # SAST - Bandit
  # ==========================================================
  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install "bandit[sarif]"

      - name: Run Bandit SARIF scan
        id: bandit-scan
        run: |
          bandit \
            -r backend/app/ \
            -f sarif \
            -o bandit-report.sarif \
            --severity-level medium || true

      - name: Run Bandit JSON scan
        id: bandit-json
        run: |
          bandit \
            -r backend/app/ \
            -f json \
            -o bandit-report.json \
            --severity-level medium || true

      - name: Run Bandit HTML report
        if: always()
        run: |
          bandit \
            -r backend/app/ \
            -f html \
            -o bandit-report.html \
            --severity-level medium || true

      - name: Analyze Bandit results
        id: bandit-analysis
        run: |
          if [ ! -f bandit-report.json ]; then
            echo "❌ Bandit report was not generated."
            echo "bandit_status=fail" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HIGH_COUNT=$(jq '[.results[]? | select(.issue_severity == "HIGH")] | length' bandit-report.json)
          MEDIUM_COUNT=$(jq '[.results[]? | select(.issue_severity == "MEDIUM")] | length' bandit-report.json)

          echo "Bandit results:"
          echo "  High:   $HIGH_COUNT"
          echo "  Medium: $MEDIUM_COUNT"

          if [ "$HIGH_COUNT" -gt 0 ] || [ "$MEDIUM_COUNT" -gt 0 ]; then
            echo "❌ Bandit found HIGH/MEDIUM security issues."
            echo "bandit_status=fail" >> "$GITHUB_OUTPUT"
          else
            echo "✅ No HIGH/MEDIUM Bandit issues detected."
            echo "bandit_status=pass" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Bandit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit-report.sarif
          category: bandit

      - name: Upload Bandit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-reports
          path: |
            bandit-report.sarif
            bandit-report.json
            bandit-report.html
          if-no-files-found: warn

      - name: SAST Security Gate
        if: always()
        run: |
          BANDIT_STATUS="${{ steps.bandit-analysis.outputs.bandit_status }}"

          echo "========================================"
          echo "SAST Security Gate"
          echo "========================================"
          echo "Bandit: $BANDIT_STATUS"
          echo "========================================"

          if [ "$BANDIT_STATUS" = "fail" ]; then
            echo "❌ SAST security gate failed."
            exit 1
          fi

          echo "✅ SAST security gate passed."


  # ==========================================================
  # Container Security Scan
  # ==========================================================
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Build RAG Image
      # --------------------------------------------------------
      - name: Build RAG image
        run: |
          docker build \
            -t customer-support-rag:scan \
            -f backend/docker/Dockerfile.rag \
            ./backend

      # --------------------------------------------------------
      # Build API Image
      # --------------------------------------------------------
      - name: Build API image
        run: |
          docker build \
            -t customer-support-api:scan \
            -f backend/docker/Dockerfile.backend \
            ./backend

      # --------------------------------------------------------
      # Build Frontend Image
      # --------------------------------------------------------
      - name: Build Frontend image
        run: |
          docker build \
            -t customer-support-frontend:scan \
            -f frontend/Dockerfile.frontend \
            ./frontend

      # ========================================================
      # Trivy - RAG
      # ========================================================
      - name: Trivy scan - RAG
        id: trivy-rag
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: customer-support-rag:scan
          format: sarif
          output: trivy-rag.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '1'
          ignore-unfixed: false

      - name: Trivy JSON - RAG
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: customer-support-rag:scan
          format: json
          output: trivy-rag.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'
          ignore-unfixed: false

      # ========================================================
      # Trivy - API
      # ========================================================
      - name: Trivy scan - API
        id: trivy-api
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: customer-support-api:scan
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '1'
          ignore-unfixed: false

      - name: Trivy JSON - API
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: customer-support-api:scan
          format: json
          output: trivy-api.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'
          ignore-unfixed: false

      # ========================================================
      # Trivy - Frontend
      # ========================================================
      - name: Trivy scan - Frontend
        id: trivy-frontend
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: customer-support-frontend:scan
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '1'
          ignore-unfixed: false

      - name: Trivy JSON - Frontend
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: customer-support-frontend:scan
          format: json
          output: trivy-frontend.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'
          ignore-unfixed: false

      # ========================================================
      # Display Trivy Findings
      # ========================================================
      - name: Analyze Trivy findings
        if: always()
        run: |
          echo "========================================"
          echo "Trivy Security Findings"
          echo "========================================"

          for json_file in \
            trivy-rag.json \
            trivy-api.json \
            trivy-frontend.json
          do
            if [ -f "$json_file" ]; then
              echo ""
              echo "----------------------------------------"
              echo "File: $json_file"
              echo "----------------------------------------"

              jq -r '
                .Results[]?.Vulnerabilities[]? |
                {
                  cve: .VulnerabilityID,
                  severity: .Severity,
                  package: .PkgName,
                  installed: .InstalledVersion,
                  fixed: .FixedVersion,
                  status: .Status,
                  title: .Title
                } |
                "🔴 [\(.severity)] \(.cve)\n   📦 Package: \(.package)\n   📌 Installed: \(.installed)\n   ✅ Fixed: \(.fixed // "N/A")\n   📊 Status: \(.status // "N/A")\n   💬 \(.title // "")\n"
              ' "$json_file" | head -150 || true
            else
              echo "⚠️ $json_file was not generated."
            fi
          done

      # ========================================================
      # Upload Trivy SARIF
      # ========================================================
      - name: Upload RAG Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-rag.sarif
          category: trivy-rag

      - name: Upload API Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      - name: Upload Frontend Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      # ========================================================
      # Upload Trivy Reports
      # ========================================================
      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-rag.sarif
            trivy-rag.json
            trivy-api.sarif
            trivy-api.json
            trivy-frontend.sarif
            trivy-frontend.json
          if-no-files-found: warn

      # ========================================================
      # Container Security Gate
      # ========================================================
      - name: Container Security Gate
        if: always()
        run: |
          RAG_STATUS="${{ steps.trivy-rag.outcome }}"
          API_STATUS="${{ steps.trivy-api.outcome }}"
          FRONTEND_STATUS="${{ steps.trivy-frontend.outcome }}"

          echo "========================================"
          echo "Container Security Gate"
          echo "========================================"
          echo "RAG Image:      $RAG_STATUS"
          echo "API Image:      $API_STATUS"
          echo "Frontend Image: $FRONTEND_STATUS"
          echo "========================================"

          if [ "$RAG_STATUS" = "failure" ] || \
             [ "$RAG_STATUS" = "skipped" ] || \
             [ "$API_STATUS" = "failure" ] || \
             [ "$API_STATUS" = "skipped" ] || \
             [ "$FRONTEND_STATUS" = "failure" ] || \
             [ "$FRONTEND_STATUS" = "skipped" ]; then

            echo "❌ Container vulnerabilities found."
            exit 1
          fi

          echo "✅ Container security gate passed."


  # ==========================================================
  # Final Security Gate
  # ==========================================================
  security-gate:
    name: Final Security Gate
    runs-on: ubuntu-latest

    needs:
      - dependency-scan
      - sast
      - container-scan

    if: always()

    steps:
      - name: Evaluate security jobs
        run: |
          DEPENDENCY_STATUS="${{ needs.dependency-scan.result }}"
          SAST_STATUS="${{ needs.sast.result }}"
          CONTAINER_STATUS="${{ needs.container-scan.result }}"

          echo "========================================"
          echo "Final Security Gate"
          echo "========================================"
          echo "Dependency Scan: $DEPENDENCY_STATUS"
          echo "SAST:             $SAST_STATUS"
          echo "Container Scan:   $CONTAINER_STATUS"
          echo "========================================"

          if [ "$DEPENDENCY_STATUS" != "success" ] || \
             [ "$SAST_STATUS" != "success" ] || \
             [ "$CONTAINER_STATUS" != "success" ]; then

            echo "❌ Final security gate failed."
            exit 1
          fi

          echo "✅ All security checks passed."
