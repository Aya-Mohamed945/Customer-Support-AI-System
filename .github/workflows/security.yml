# .github/workflows/security.yml
# ============================================================
# SECURITY PIPELINE - Customer Support AI
# ============================================================
# Policy:
#   - CRITICAL/HIGH/MEDIUM with an available fix → Fail the pipeline
#   - CRITICAL/HIGH/MEDIUM without an available fix → Report only
#   - LOW severity → Report only (does not block)
#   - SARIF reports uploaded to GitHub Security tab (CodeQL v4)
#   - Trivy scans must execute successfully (invalid/missing report = failure)
# ============================================================

name: 🔒 Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:

  # ============================================================
  # 1. DEPENDENCY SCANNING
  # ============================================================
  dependency-scan:
    name: 📦 Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install pip-audit
        run: python -m pip install pip-audit

      - name: 🔍 Scan Python Dependencies
        id: pip-scan
        continue-on-error: true
        run: |
          pip-audit -r backend/requirements.txt --desc 2>&1 | tee pip-audit-report.txt || true

      - name: 📊 Analyze Python Results
        id: pip-analysis
        run: |
          echo "============================================================"
          echo "📦 PYTHON DEPENDENCY ANALYSIS"
          echo "============================================================"

          if grep -q "Found.*vulnerabilities" pip-audit-report.txt 2>/dev/null; then
            VULN_COUNT=$(grep -o "[0-9]\+ vulnerabilities" pip-audit-report.txt | head -1 | grep -o "[0-9]\+" || echo "0")

            echo "❌ Found $VULN_COUNT vulnerabilities in Python dependencies:"
            grep -v "^Name\|^---\|^Found" pip-audit-report.txt | head -20 || true

            echo ""
            echo "🔧 Please review the report in artifacts."
            echo "pip_status=fail" >> "$GITHUB_OUTPUT"
          else
            echo "✅ No vulnerabilities found in Python dependencies."
            echo "pip_status=pass" >> "$GITHUB_OUTPUT"
          fi

      - name: 📤 Upload Python Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-report
          path: pip-audit-report.txt
          if-no-files-found: ignore

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: 🔍 Scan NPM Dependencies
        id: npm-scan
        continue-on-error: true
        working-directory: frontend
        run: |
          npm audit --production --audit-level=high --json 2>/dev/null > npm-audit-report.json || true

      - name: 📊 Analyze NPM Results
        id: npm-analysis
        working-directory: frontend
        run: |
          echo "============================================================"
          echo "📦 NPM DEPENDENCY ANALYSIS"
          echo "============================================================"

          if [ -f npm-audit-report.json ] && [ -s npm-audit-report.json ]; then
            if jq -e '.metadata.vulnerabilities | .high > 0 or .moderate > 0' npm-audit-report.json >/dev/null 2>&1; then
              HIGH_COUNT=$(jq '.metadata.vulnerabilities.high // 0' npm-audit-report.json)
              MODERATE_COUNT=$(jq '.metadata.vulnerabilities.moderate // 0' npm-audit-report.json)

              echo "❌ Found vulnerabilities:"
              echo "   HIGH: $HIGH_COUNT"
              echo "   MODERATE: $MODERATE_COUNT"

              echo ""
              echo "🔧 Please run 'npm audit fix' locally."
              echo "npm_status=fail" >> "$GITHUB_OUTPUT"
            else
              echo "✅ No HIGH/MODERATE vulnerabilities found."
              echo "npm_status=pass" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "⚠️ No npm audit report generated."
            echo "npm_status=pass" >> "$GITHUB_OUTPUT"
          fi

      - name: 📤 Upload NPM Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-report
          path: frontend/npm-audit-report.json
          if-no-files-found: ignore

      - name: 🚦 Dependency Gate
        if: always()
        run: |
          if [ "${{ steps.pip-analysis.outputs.pip_status }}" == "fail" ] || \
             [ "${{ steps.npm-analysis.outputs.npm_status }}" == "fail" ]; then
            echo "❌ Dependency scan failed."
            exit 1
          else
            echo "✅ All dependency checks passed."
            exit 0
          fi

  # ============================================================
  # 2. SAST - STATIC APPLICATION SECURITY TESTING
  # ============================================================
  sast:
    name: 🔍 SAST Scan (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Bandit with SARIF support
        run: |
          python -m pip install "bandit[sarif]"

      - name: 🔍 Run Bandit Security Scan
        id: bandit-scan
        working-directory: backend
        continue-on-error: true
        run: |
          bandit -r app/ -f sarif -o bandit-report.sarif
          bandit -r app/ -f html -o bandit-report.html
          bandit -r app/ -f json -o bandit-report.json

      - name: 📊 Analyze Bandit Results
        id: bandit-analysis
        working-directory: backend
        run: |
          echo "============================================================"
          echo "🔍 BANDIT SECURITY ANALYSIS"
          echo "============================================================"

          HIGH_COUNT=$(jq '.results | map(select(.issue_severity == "HIGH")) | length' bandit-report.json 2>/dev/null || echo "0")
          MEDIUM_COUNT=$(jq '.results | map(select(.issue_severity == "MEDIUM")) | length' bandit-report.json 2>/dev/null || echo "0")

          echo "📊 Findings Summary:"
          echo "   HIGH:   $HIGH_COUNT"
          echo "   MEDIUM: $MEDIUM_COUNT"
          echo "============================================================"

          if [ "$HIGH_COUNT" -gt 0 ] || [ "$MEDIUM_COUNT" -gt 0 ]; then
            echo ""
            echo "❌ HIGH/MEDIUM vulnerabilities found."
            echo "bandit_status=fail" >> "$GITHUB_OUTPUT"
          else
            echo ""
            echo "✅ No HIGH or MEDIUM vulnerabilities found."
            echo "bandit_status=pass" >> "$GITHUB_OUTPUT"
          fi

      - name: 📤 Upload Bandit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: |
            backend/bandit-report.sarif
            backend/bandit-report.html
            backend/bandit-report.json
          if-no-files-found: ignore

      - name: 📤 Upload Bandit SARIF to GitHub Security
        if: always() && hashFiles('backend/bandit-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: backend/bandit-report.sarif
          category: bandit-sast

      - name: 🚦 Bandit Gate
        if: always()
        run: |
          if [ "${{ steps.bandit-analysis.outputs.bandit_status }}" == "fail" ]; then
            echo "❌ Bandit found HIGH/MEDIUM vulnerabilities."
            exit 1
          else
            echo "✅ Bandit passed all checks."
            exit 0
          fi

  # ============================================================
  # 3. CONTAINER SCANNING
  # ============================================================
  container-scan:
    name: 🐳 Container Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================================
      # 🔐 SOURCE DEPENDENCY PIN VERIFICATION
      # ========================================================
      - name: 🔐 Verify Backend Security Dependency Pins
        if: always()
        run: |
          echo "============================================================"
          echo "🔐 BACKEND SECURITY DEPENDENCY VERIFICATION"
          echo "============================================================"

          echo "Git commit: $GITHUB_SHA"
          echo ""
          echo "Security pins:"
          grep -E '^(msgpack|setuptools)==' backend/requirements.txt || true

          echo ""
          echo "Expected:"
          echo "msgpack==1.2.1"
          echo "setuptools==83.0.0"

          if ! grep -qx 'msgpack==1.2.1' backend/requirements.txt; then
            echo "❌ msgpack pin is incorrect."
            exit 1
          fi

          if ! grep -qx 'setuptools==83.0.0' backend/requirements.txt; then
            echo "❌ setuptools pin is incorrect."
            exit 1
          fi

          echo "✅ Source dependency pins verified."

      # ========================================================
      # 🏗️ BUILD IMAGES
      # ========================================================
      - name: 🏗️ Build RAG Image
        run: |
          docker build \
            --pull \
            --no-cache \
            -t customer-support-rag:scan \
            -f backend/docker/Dockerfile.rag \
            ./backend

      - name: 🏗️ Build API Image
        run: |
          docker build \
            --pull \
            --no-cache \
            -t customer-support-api:scan \
            -f backend/docker/Dockerfile.backend \
            ./backend

      - name: 🏗️ Build Frontend Image
        run: |
          docker build \
            --pull \
            --no-cache \
            -t customer-support-frontend:scan \
            -f frontend/Dockerfile.frontend \
            ./frontend

      # ========================================================
      # 🔎 BACKEND IMAGE PACKAGE DIAGNOSTICS
      # ========================================================
      - name: 🔎 Verify Backend Image Package Locations
        if: always()
        run: |
          echo "============================================================"
          echo "🔎 BACKEND IMAGE PACKAGE LOCATION DIAGNOSTICS"
          echo "============================================================"

          for image in customer-support-rag:scan customer-support-api:scan; do

            echo ""
            echo "============================================================"
            echo "🐳 IMAGE: $image"
            echo "============================================================"

            echo ""
            echo "📌 Image ID:"
            docker image inspect "$image" \
              --format '{{.Id}}' 2>/dev/null || true

            echo ""
            echo "📌 Image created:"
            docker image inspect "$image" \
              --format '{{.Created}}' 2>/dev/null || true

            echo ""
            echo "📌 Python package metadata:"
            docker run --rm \
              --entrypoint python \
              "$image" \
              -c '
          import importlib.metadata as metadata

          for package in ["msgpack", "setuptools"]:
              try:
                  dist = metadata.distribution(package)
                  location = dist.locate_file("")
                  print(f"{package}:")
                  print(f"  version={dist.version}")
                  print(f"  location={location}")
              except Exception as exc:
                  print(f"{package}: ERROR: {exc}")
          ' || true

            echo ""
            echo "📌 Debian package check:"
            docker run --rm \
              --entrypoint sh \
              "$image" \
              -c '
          echo "Installed Debian packages matching target names:"
          dpkg-query -W -f="${Package} ${Version}\n" 2>/dev/null \
            | grep -E "^(python3-msgpack|python3-setuptools|python3-pkg-resources) " \
            || echo "No matching Debian packages found."
          ' || true

            echo ""
            echo "📌 Filesystem metadata check:"
            docker run --rm \
              --entrypoint sh \
              "$image" \
              -c '
          echo "Potential Python package metadata locations:"
          find /usr/lib /usr/local/lib \
            -type f \
            \( -path "*msgpack*.dist-info/METADATA" \
            -o -path "*msgpack*.egg-info/PKG-INFO" \
            -o -path "*setuptools*.dist-info/METADATA" \
            -o -path "*setuptools*.egg-info/PKG-INFO" \) \
            2>/dev/null \
            | sort
          ' || true

          done

      # ========================================================
      # 🔍 Trivy Scan - RAG (SARIF + JSON)
      # ========================================================
      - name: 🔍 Scan RAG Image (SARIF)
        id: trivy-rag
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: customer-support-rag:scan
          format: sarif
          output: trivy-rag.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 1
          ignore-unfixed: false

      - name: 🔍 Scan RAG Image (JSON)
        id: trivy-rag-json
        continue-on-error: true
        run: |
          trivy image \
            --format json \
            --output trivy-rag.json \
            --severity CRITICAL,HIGH,MEDIUM \
            --ignore-unfixed=false \
            customer-support-rag:scan || true

      # ========================================================
      # 🔍 Trivy Scan - API (SARIF + JSON)
      # ========================================================
      - name: 🔍 Scan API Image (SARIF)
        id: trivy-api
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: customer-support-api:scan
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 1
          ignore-unfixed: false

      - name: 🔍 Scan API Image (JSON)
        id: trivy-api-json
        continue-on-error: true
        run: |
          trivy image \
            --format json \
            --output trivy-api.json \
            --severity CRITICAL,HIGH,MEDIUM \
            --ignore-unfixed=false \
            customer-support-api:scan || true

      # ========================================================
      # 🔍 Trivy Scan - Frontend (SARIF + JSON)
      # ========================================================
      - name: 🔍 Scan Frontend Image (SARIF)
        id: trivy-frontend
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: customer-support-frontend:scan
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 1
          ignore-unfixed: false

      - name: 🔍 Scan Frontend Image (JSON)
        id: trivy-frontend-json
        continue-on-error: true
        run: |
          trivy image \
            --format json \
            --output trivy-frontend.json \
            --severity CRITICAL,HIGH,MEDIUM \
            --ignore-unfixed=false \
            customer-support-frontend:scan || true

      # ========================================================
      # 📊 FRONTEND DEPENDENCY DIAGNOSTICS
      # ========================================================
      - name: 📊 Analyze Frontend Dependencies
        id: frontend-deps
        if: always()
        working-directory: frontend
        run: |
          echo "============================================================"
          echo "🔍 FRONTEND DEPENDENCY DIAGNOSTICS"
          echo "============================================================"

          echo ""
          echo "------------------------------------------------------------"
          echo "📌 Node.js version:"
          node --version

          echo ""
          echo "📌 npm version:"
          npm --version

          echo ""
          echo "------------------------------------------------------------"
          echo "📌 DEPENDENCY TREE (Target Packages)"
          echo "------------------------------------------------------------"

          for pkg in brace-expansion ip-address tar undici; do
            echo ""
            echo "🔎 Package: $pkg"
            npm ls "$pkg" --all 2>&1 | head -20 || true
          done

          echo ""
          echo "------------------------------------------------------------"
          echo "📌 TOP-LEVEL DEPENDENCIES"
          echo "------------------------------------------------------------"

          npm ls --depth=0 2>&1 || true

          echo ""
          echo "------------------------------------------------------------"
          echo "📌 PACKAGE-LOCK.JSON SEARCH"
          echo "------------------------------------------------------------"

          for pkg in brace-expansion ip-address tar undici; do
            echo ""
            echo "🔎 Searching for: $pkg"

            if [ -f package-lock.json ]; then
              grep -A 5 "\"$pkg\":" package-lock.json | head -10 || \
                echo "   Not found in package-lock.json"
            else
              echo "   package-lock.json not found"
            fi
          done

      # ========================================================
      # 🐳 FRONTEND BASE IMAGE DIAGNOSTICS
      # ========================================================
      - name: Analyze Frontend Base Image
        if: always()
        run: |
          echo "============================================================"
          echo "🐳 FRONTEND BASE IMAGE DIAGNOSTICS"
          echo "============================================================"

          echo ""
          echo "📌 Node version inside final image:"
          docker run --rm customer-support-frontend:scan \
            node --version || true

          echo ""
          echo "📌 npm availability inside final image:"
          docker run --rm customer-support-frontend:scan \
            sh -c 'command -v npm || echo "npm not installed (expected for production image)"'

          echo ""
          echo "📌 Alpine version:"
          docker run --rm customer-support-frontend:scan \
            cat /etc/alpine-release || true

          echo ""
          echo "📌 OpenSSL version:"
          docker run --rm customer-support-frontend:scan \
            sh -c 'openssl version -a' || true

          echo ""
          echo "📌 Installed OpenSSL packages:"
          docker run --rm customer-support-frontend:scan \
            sh -c 'apk info -v 2>/dev/null | grep -E "^(openssl|libcrypto3|libssl3)-" || true'

          echo ""
          echo "============================================================"
          echo "📦 FINAL IMAGE NODE MODULE CHECK"
          echo "============================================================"

          docker run --rm customer-support-frontend:scan \
            sh -c '
              for pkg in brace-expansion ip-address tar undici; do
                echo ""
                echo "🔎 Package: $pkg"

                if [ -f "node_modules/$pkg/package.json" ]; then
                  node -e "console.log(require(\"./node_modules/$pkg/package.json\").version)" 2>/dev/null || true
                else
                  echo "Not present at top-level node_modules"
                fi
              done
            ' || true

      # ========================================================
      # 📊 EXTRACT FULL CVE DETAILS
      # ========================================================
      - name: 📊 Extract Full CVE Details
        id: trivy-extract
        if: always()
        run: |
          echo "============================================================"
          echo "🐳 TRIVY VULNERABILITY DETAILS (Full)"
          echo "============================================================"

          for json_file in trivy-rag.json trivy-api.json trivy-frontend.json; do

            if [ -f "$json_file" ] && [ -s "$json_file" ]; then

              echo ""
              echo "📁 $(basename "$json_file" .json):"
              echo "------------------------------------------------------------"

              jq -r '.Results[]?.Vulnerabilities[]? |
                {
                  cve: .VulnerabilityID,
                  severity: .Severity,
                  package: .PkgName,
                  installed: .InstalledVersion,
                  fixed: .FixedVersion,
                  status: .Status,
                  title: .Title
                } |
                "   🔴 [\(.severity)] \(.cve)\n      📦 Package: \(.package)\n      📌 Installed: \(.installed)\n      ✅ Fixed: \(.fixed // "N/A")\n      📊 Status: \(.status // "N/A")\n      💬 \(.title // "")\n"
              ' "$json_file" 2>/dev/null | head -100 || true

            else

              echo ""
              echo "⚠️ $json_file not found or empty"

            fi

          done

          echo "============================================================"

      # ========================================================
      # 📤 UPLOAD REPORTS
      # ========================================================
      - name: 📤 Upload Trivy SARIF - RAG
        if: always() && hashFiles('trivy-rag.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-rag.sarif
          category: trivy-rag

      - name: 📤 Upload Trivy SARIF - API
        if: always() && hashFiles('trivy-api.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      - name: 📤 Upload Trivy SARIF - Frontend
        if: always() && hashFiles('trivy-frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: 📤 Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-rag.sarif
            trivy-rag.json
            trivy-api.sarif
            trivy-api.json
            trivy-frontend.sarif
            trivy-frontend.json
          if-no-files-found: ignore

      # ========================================================
      # 🚦 TRIVY SECURITY GATE
      # ========================================================
      - name: 🚦 Trivy Security Gate
        if: always()
        run: |
          echo "============================================================"
          echo "🐳 TRIVY CONTAINER SECURITY GATE"
          echo "============================================================"

          echo ""
          echo "📊 Trivy Scan Execution Results:"
          echo "   RAG Image:      ${{ steps.trivy-rag.outcome }}"
          echo "   API Image:      ${{ steps.trivy-api.outcome }}"
          echo "   Frontend Image: ${{ steps.trivy-frontend.outcome }}"

          echo ""
          echo "============================================================"
          echo "🔎 Evaluating actionable vulnerabilities..."
          echo "============================================================"

          GATE_FAILED=0

          for image in rag api frontend; do

            json_file="trivy-${image}.json"

            echo ""
            echo "------------------------------------------------------------"
            echo "🐳 IMAGE: ${image^^}"
            echo "------------------------------------------------------------"

            # --------------------------------------------------
            # Scan must produce a valid JSON report.
            # --------------------------------------------------
            if [ ! -s "$json_file" ]; then
              echo "❌ Missing or empty Trivy report: $json_file"
              GATE_FAILED=1
              continue
            fi

            if ! jq empty "$json_file" >/dev/null 2>&1; then
              echo "❌ Invalid Trivy JSON report: $json_file"
              GATE_FAILED=1
              continue
            fi

            # --------------------------------------------------
            # Count all reported vulnerabilities.
            # --------------------------------------------------
            TOTAL=$(jq '
              [
                .Results[]?.Vulnerabilities[]?
              ] | length
            ' "$json_file")

            # --------------------------------------------------
            # Count vulnerabilities that have an available fix.
            # These are considered actionable and block the CI.
            # --------------------------------------------------
            ACTIONABLE=$(jq '
              [
                .Results[]?.Vulnerabilities[]?
                | select(
                    (.Severity == "CRITICAL"
                    or .Severity == "HIGH"
                    or .Severity == "MEDIUM")
                  )
                | select((.FixedVersion // "") != "")
                | select((.Status // "") != "will_not_fix")
              ] | length
            ' "$json_file")

            # --------------------------------------------------
            # Count HIGH/CRITICAL/MEDIUM vulnerabilities that
            # currently have no available fix.
            # --------------------------------------------------
            UNFIXED=$(jq '
              [
                .Results[]?.Vulnerabilities[]?
                | select(
                    (.Severity == "CRITICAL"
                    or .Severity == "HIGH"
                    or .Severity == "MEDIUM")
                  )
                | select((.FixedVersion // "") == "")
              ] | length
            ' "$json_file")

            # --------------------------------------------------
            # Count LOW vulnerabilities.
            # --------------------------------------------------
            LOW=$(jq '
              [
                .Results[]?.Vulnerabilities[]?
                | select(.Severity == "LOW")
              ] | length
            ' "$json_file")

            echo "📊 Findings:"
            echo "   Total vulnerabilities:               $TOTAL"
            echo "   Actionable HIGH/MEDIUM/CRITICAL:    $ACTIONABLE"
            echo "   Unfixed HIGH/MEDIUM/CRITICAL:       $UNFIXED"
            echo "   LOW:                                 $LOW"

            # --------------------------------------------------
            # Print actionable vulnerabilities.
            # --------------------------------------------------
            if [ "$ACTIONABLE" -gt 0 ]; then

              echo ""
              echo "❌ ACTIONABLE VULNERABILITIES FOUND:"
              echo ""

              jq -r '
                .Results[]?.Vulnerabilities[]?
                | select(
                    (.Severity == "CRITICAL"
                    or .Severity == "HIGH"
                    or .Severity == "MEDIUM")
                  )
                | select((.FixedVersion // "") != "")
                | select((.Status // "") != "will_not_fix")
                | "   [\(.Severity)] \(.VulnerabilityID)
      Package:  \(.PkgName)
      Installed: \(.InstalledVersion)
      Fixed:     \(.FixedVersion)
      Status:    \(.Status // "N/A")
                "
              ' "$json_file"

              GATE_FAILED=1

            else
              echo "✅ No actionable HIGH/MEDIUM/CRITICAL vulnerabilities."
            fi

            # --------------------------------------------------
            # Report unfixed vulnerabilities without blocking.
            # --------------------------------------------------
            if [ "$UNFIXED" -gt 0 ]; then

              echo ""
              echo "⚠️ UNFIXED VULNERABILITIES:"
              echo "   These are reported but do not block the pipeline."

              jq -r '
                .Results[]?.Vulnerabilities[]?
                | select(
                    (.Severity == "CRITICAL"
                    or .Severity == "HIGH"
                    or .Severity == "MEDIUM")
                  )
                | select((.FixedVersion // "") == "")
                | "   [\(.Severity)] \(.VulnerabilityID)
      Package:  \(.PkgName)
      Installed: \(.InstalledVersion)
      Fixed:     N/A
      Status:    \(.Status // "N/A")
                "
              ' "$json_file"

            fi

          done

          echo ""
          echo "============================================================"
          echo "🚦 FINAL TRIVY DECISION"
          echo "============================================================"

          if [ "$GATE_FAILED" -eq 1 ]; then
            echo "❌ Actionable container vulnerabilities found."
            echo "🔧 Fix vulnerabilities with an available patched version."
            echo "📊 Unfixed vulnerabilities remain reported in SARIF/artifacts."
            exit 1
          fi

          echo "✅ No actionable CRITICAL/HIGH/MEDIUM container vulnerabilities found."
          echo "⚠️ Unfixed vulnerabilities, if any, are report-only."
          echo "============================================================"

  # ============================================================
  # 4. SECURITY GATE
  # ============================================================
  security-gate:
    name: 🚦 Security Gate
    runs-on: ubuntu-latest
    needs:
      - dependency-scan
      - sast
      - container-scan
    if: always()

    steps:
      - name: 🔍 Evaluate All Security Results
        run: |
          echo "============================================================"
          echo "🚦 SECURITY GATE - Final Decision"
          echo "============================================================"

          echo ""
          echo "📊 Job Results:"
          echo "   Dependency Scan: ${{ needs.dependency-scan.result }}"
          echo "   SAST Scan:       ${{ needs.sast.result }}"
          echo "   Container Scan:  ${{ needs.container-scan.result }}"

          echo ""

          if [ "${{ needs.dependency-scan.result }}" != "success" ] || \
             [ "${{ needs.sast.result }}" != "success" ] || \
             [ "${{ needs.container-scan.result }}" != "success" ]; then

            echo "❌ Security checks failed."
            echo ""
            echo "🔧 Action Required:"
            echo "   1. Download security reports from artifacts"
            echo "   2. Review and fix vulnerabilities"
            echo "   3. Re-run the workflow"

            exit 1
          fi

          echo "✅ All security checks passed successfully."

      - name: 📢 Security Summary
        if: always()
        run: |
          echo "============================================================"
          echo "📊 SECURITY SCAN SUMMARY"
          echo "============================================================"

          echo ""
          echo "✅ Python Dependencies: Checked"
          echo "✅ NPM Dependencies:   Checked"
          echo "✅ SAST (Bandit):       Checked"
          echo "✅ Container (Trivy):   Checked"

          echo ""
          echo "🔍 SARIF reports uploaded to GitHub Security tab (CodeQL v4)"
          echo "============================================================"
