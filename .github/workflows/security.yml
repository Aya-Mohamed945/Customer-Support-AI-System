# .github/workflows/security.yml
name: 🔒 Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:

  # ============================================
  # 1. DEPENDENCY SCANNING
  # ============================================
  dependency-scan:
    name: 📦 Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🔍 Scan Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools pip-audit
          pip-audit -r backend/requirements.txt --desc | tee pip-audit-report.txt

      - name: 📤 Upload Python Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-report
          path: pip-audit-report.txt
          if-no-files-found: ignore

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: 🔍 Scan NPM Dependencies
        working-directory: frontend
        run: npm audit --production --audit-level=high --json > npm-audit-report.json

      - name: 📤 Upload NPM Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-report
          path: frontend/npm-audit-report.json
          if-no-files-found: ignore

  # ============================================
  # 2. SAST - STATIC APPLICATION SECURITY TESTING
  # ============================================
  sast:
    name: 🔍 SAST Scan (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Bandit
        run: python -m pip install bandit

      - name: 🔍 Run Bandit Security Scan
        working-directory: backend
        run: |
          bandit -r app/ -f json -o bandit-report.json
          bandit -r app/ -f html -o bandit-report.html

      - name: 📤 Upload Bandit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: |
            backend/bandit-report.json
            backend/bandit-report.html
          if-no-files-found: ignore

  # ============================================
  # 3. CONTAINER SCANNING
  # ============================================
  container-scan:
    name: 🐳 Container Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build RAG Image
        run: |
          docker build \
            -t customer-support-rag:scan \
            -f backend/docker/Dockerfile.rag \
            ./backend

      - name: 🏗️ Build API Image
        run: |
          docker build \
            -t customer-support-api:scan \
            -f backend/docker/Dockerfile.backend \
            ./backend

      - name: 🏗️ Build Frontend Image
        run: |
          docker build \
            -t customer-support-frontend:scan \
            -f frontend/Dockerfile.frontend \
            ./frontend

      - name: 🔍 Scan RAG Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: customer-support-rag:scan
          format: sarif
          output: trivy-rag.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: 🔍 Scan API Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: customer-support-api:scan
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: 🔍 Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: customer-support-frontend:scan
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: 📤 Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-rag.sarif
            trivy-api.sarif
            trivy-frontend.sarif
          if-no-files-found: ignore

  # ============================================
  # 4. SECURITY GATE
  # ============================================
  security-gate:
    name: 🚦 Security Gate
    runs-on: ubuntu-latest
    needs:
      - dependency-scan
      - sast
      - container-scan
    if: always()

    steps:
      - name: 🔍 Evaluate Security Results
        run: |
          echo "============================================================"
          echo "🚦 SECURITY GATE - Final Decision"
          echo "============================================================"

          echo "Dependency Scan: ${{ needs.dependency-scan.result }}"
          echo "SAST Scan:       ${{ needs.sast.result }}"
          echo "Container Scan:  ${{ needs.container-scan.result }}"
          echo "============================================================"

          if [ "${{ needs.dependency-scan.result }}" != "success" ] || \
             [ "${{ needs.sast.result }}" != "success" ] || \
             [ "${{ needs.container-scan.result }}" != "success" ]; then

            echo "❌ Security checks failed."
            echo "Please review the security reports and resolve the detected issues."
            exit 1
          fi

          echo "✅ All security checks passed successfully."

      - name: 📢 Security Summary
        if: always()
        run: |
          echo "============================================================"
          echo "📊 SECURITY SCAN SUMMARY"
          echo "============================================================"
          echo "📦 Python Dependency Scan"
          echo "📦 NPM Dependency Scan"
          echo "🔍 SAST - Bandit"
          echo "🐳 Container Scanning - Trivy"
          echo "============================================================"
          echo "📁 Security reports are available as workflow artifacts."
          echo "============================================================"
