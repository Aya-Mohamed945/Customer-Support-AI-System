          echo "✅ NPM Dependencies:   Checked"
          echo "✅ SAST (Bandit):      Checked"
          echo "✅ Container (Trivy):  Checked"
          echo ""
          echo "🔍 SARIF reports uploaded to GitHub Security tab (CodeQL v4)"
          echo "============================================================"
