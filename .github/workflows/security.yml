# .github/workflows/security.yml
name: 🔒 Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ============================================
  # DEPENDENCY SCANNING
  # ============================================
  dependency-scan:
    name: 📦 Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🔍 Scan Python Dependencies
        uses: pypa/gh-action-pip-audit@c0f3f5e
        with:
          requirements: backend/requirements.txt

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 🔍 Scan NPM Dependencies
        if: always()
        run: |
          cd frontend
          npm audit --production --audit-level=high || true

  # ============================================
  # SAST - STATIC APPLICATION SECURITY TESTING
  # ============================================
  sast:
    name: 🔍 SAST Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Bandit
        run: pip install bandit

      - name: 🔍 Run Bandit Security Scan
        run: |
          cd backend
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ -f html -o bandit-report.html || true

      - name: 📤 Upload Bandit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: backend/bandit-report.*
          if-no-files-found: ignore

  # ============================================
  # CONTAINER SCANNING
  # ============================================
  container-scan:
    name: 🐳 Container Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker Images
        run: |
          docker build -t customer-support-rag:scan -f backend/docker/Dockerfile.rag ./backend || true
          docker build -t customer-support-api:scan -f backend/docker/Dockerfile.backend ./backend || true
          docker build -t customer-support-frontend:scan -f frontend/Dockerfile.frontend ./frontend || true

      - name: 🔍 Scan RAG Image
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: customer-support-rag:scan
          format: "sarif"
          output: "trivy-rag.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: 0

      - name: 🔍 Scan API Image
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: customer-support-api:scan
          format: "sarif"
          output: "trivy-api.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: 0

      - name: 🔍 Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: customer-support-frontend:scan
          format: "sarif"
          output: "trivy-frontend.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: 0

      - name: 📤 Upload Trivy Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports
          path: |
            trivy-rag.sarif
            trivy-api.sarif
            trivy-frontend.sarif
          if-no-files-found: ignore
