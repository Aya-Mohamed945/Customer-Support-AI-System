# .github/workflows/security.yml
# ============================================================
# SECURITY PIPELINE - Customer Support AI
# ============================================================
# Policy:
#   - HIGH/MEDIUM severity → Fail the pipeline
#   - LOW severity → Report only (does not block)
#   - CRITICAL/HIGH in containers → Fail the pipeline
# ============================================================

name: 🔒 Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:

  # ============================================================
  # 1. DEPENDENCY SCANNING
  # ============================================================
  dependency-scan:
    name: 📦 Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      # ----- Python Dependencies -----
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install pip-audit
        run: python -m pip install pip-audit

      - name: 🔍 Scan Python Dependencies
        id: pip-scan
        continue-on-error: true
        run: |
          pip-audit -r backend/requirements.txt --desc | tee pip-audit-report.txt

      - name: 📊 Analyze Python Results
        id: pip-analysis
        run: |
          echo "============================================================"
          echo "📦 PYTHON DEPENDENCY ANALYSIS"
          echo "============================================================"

          # ✅ Extract vulnerability count by severity
          CRITICAL_COUNT=$(grep -c "CRITICAL" pip-audit-report.txt 2>/dev/null || echo "0")
          HIGH_COUNT=$(grep -c "HIGH" pip-audit-report.txt 2>/dev/null || echo "0")
          MEDIUM_COUNT=$(grep -c "MEDIUM" pip-audit-report.txt 2>/dev/null || echo "0")
          LOW_COUNT=$(grep -c "LOW" pip-audit-report.txt 2>/dev/null || echo "0")

          echo "📊 Findings Summary:"
          echo "   CRITICAL: $CRITICAL_COUNT"
          echo "   HIGH:     $HIGH_COUNT"
          echo "   MEDIUM:   $MEDIUM_COUNT"
          echo "   LOW:      $LOW_COUNT"
          echo "============================================================"

          # ✅ Show details if any vulnerabilities found
          if [ "$CRITICAL_COUNT" -gt 0 ] || [ "$HIGH_COUNT" -gt 0 ] || [ "$MEDIUM_COUNT" -gt 0 ]; then
            echo ""
            echo "❌ Vulnerabilities found:"
            grep -E "CRITICAL|HIGH|MEDIUM" pip-audit-report.txt 2>/dev/null || true
            echo ""
            echo "🔧 Please update affected packages."
            echo "pip_status=fail" >> $GITHUB_OUTPUT
          else
            echo ""
            echo "✅ No CRITICAL/HIGH/MEDIUM vulnerabilities found."
            echo "pip_status=pass" >> $GITHUB_OUTPUT
          fi

      - name: 📤 Upload Python Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-report
          path: pip-audit-report.txt
          if-no-files-found: ignore

      # ----- NPM Dependencies -----
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: 🔍 Scan NPM Dependencies
        id: npm-scan
        continue-on-error: true
        working-directory: frontend
        run: npm audit --production --audit-level=high --json > npm-audit-report.json

      - name: 📊 Analyze NPM Results
        id: npm-analysis
        working-directory: frontend
        run: |
          echo "============================================================"
          echo "📦 NPM DEPENDENCY ANALYSIS"
          echo "============================================================"

          # ✅ Extract vulnerability counts
          if [ -f npm-audit-report.json ]; then
            HIGH_COUNT=$(jq '.metadata.vulnerabilities.high' npm-audit-report.json 2>/dev/null || echo "0")
            MODERATE_COUNT=$(jq '.metadata.vulnerabilities.moderate' npm-audit-report.json 2>/dev/null || echo "0")
            LOW_COUNT=$(jq '.metadata.vulnerabilities.low' npm-audit-report.json 2>/dev/null || echo "0")

            echo "📊 Findings Summary:"
            echo "   HIGH:     $HIGH_COUNT"
            echo "   MODERATE: $MODERATE_COUNT"
            echo "   LOW:      $LOW_COUNT"
            echo "============================================================"

            if [ "$HIGH_COUNT" -gt 0 ] || [ "$MODERATE_COUNT" -gt 0 ]; then
              echo ""
              echo "❌ HIGH/MODERATE vulnerabilities found:"
              jq -r '.advisories | .[] | "   - [\(.severity)] \(.title)"' npm-audit-report.json 2>/dev/null || true
              echo ""
              echo "🔧 Please update affected packages."
              echo "npm_status=fail" >> $GITHUB_OUTPUT
            else
              echo ""
              echo "✅ No HIGH/MODERATE vulnerabilities found."
              echo "npm_status=pass" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️ No npm audit report generated."
            echo "npm_status=pass" >> $GITHUB_OUTPUT
          fi

      - name: 📤 Upload NPM Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-report
          path: frontend/npm-audit-report.json
          if-no-files-found: ignore

      # ----- Dependency Gate -----
      - name: 🚦 Dependency Gate
        if: always()
        run: |
          if [ "${{ steps.pip-analysis.outputs.pip_status }}" == "fail" ] || \
             [ "${{ steps.npm-analysis.outputs.npm_status }}" == "fail" ]; then
            echo "❌ Dependency scan failed. Please fix the vulnerabilities above."
            exit 1
          else
            echo "✅ All dependency checks passed."
            exit 0
          fi

  # ============================================================
  # 2. SAST - STATIC APPLICATION SECURITY TESTING
  # ============================================================
  sast:
    name: 🔍 SAST Scan (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Bandit
        run: python -m pip install bandit

      - name: 🔍 Run Bandit Security Scan
        id: bandit-scan
        working-directory: backend
        continue-on-error: true
        run: |
          bandit -r app/ -f json -o bandit-report.json
          bandit -r app/ -f html -o bandit-report.html

      - name: 📊 Analyze Bandit Results
        id: bandit-analysis
        working-directory: backend
        run: |
          echo "============================================================"
          echo "🔍 BANDIT SECURITY ANALYSIS"
          echo "============================================================"

          # ✅ jq is pre-installed on Ubuntu runners
          HIGH_COUNT=$(jq '.results | map(select(.issue_severity == "HIGH")) | length' bandit-report.json 2>/dev/null || echo "0")
          MEDIUM_COUNT=$(jq '.results | map(select(.issue_severity == "MEDIUM")) | length' bandit-report.json 2>/dev/null || echo "0")
          LOW_COUNT=$(jq '.results | map(select(.issue_severity == "LOW")) | length' bandit-report.json 2>/dev/null || echo "0")

          echo "📊 Findings Summary:"
          echo "   HIGH:   $HIGH_COUNT"
          echo "   MEDIUM: $MEDIUM_COUNT"
          echo "   LOW:    $LOW_COUNT"
          echo "============================================================"

          # ✅ Show details for HIGH/MEDIUM findings
          if [ "$HIGH_COUNT" -gt 0 ] || [ "$MEDIUM_COUNT" -gt 0 ]; then
            echo ""
            echo "❌ HIGH/MEDIUM vulnerabilities found:"
            jq -r '.results[] | select(.issue_severity == "HIGH" or .issue_severity == "MEDIUM") | "   - [\(.issue_severity)] \(.test_name): \(.filename):\(.line_number) - \(.issue_text)"' bandit-report.json 2>/dev/null || true
            echo ""
            echo "🔧 Please fix these issues."
            echo "bandit_status=fail" >> $GITHUB_OUTPUT
          else
            echo ""
            echo "✅ No HIGH or MEDIUM vulnerabilities found."
            echo "bandit_status=pass" >> $GITHUB_OUTPUT
          fi

      - name: 📤 Upload Bandit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: |
            backend/bandit-report.json
            backend/bandit-report.html
          if-no-files-found: ignore

      - name: 🚦 Bandit Gate
        if: always()
        run: |
          if [ "${{ steps.bandit-analysis.outputs.bandit_status }}" == "fail" ]; then
            echo "❌ Bandit found HIGH/MEDIUM vulnerabilities. Failing the pipeline."
            exit 1
          else
            echo "✅ Bandit passed all checks."
            exit 0
          fi

  # ============================================================
  # 3. CONTAINER SCANNING
  # ============================================================
  container-scan:
    name: 🐳 Container Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build RAG Image
        run: |
          docker build \
            -t customer-support-rag:scan \
            -f backend/docker/Dockerfile.rag \
            ./backend

      - name: 🏗️ Build API Image
        run: |
          docker build \
            -t customer-support-api:scan \
            -f backend/docker/Dockerfile.backend \
            ./backend

      - name: 🏗️ Build Frontend Image
        run: |
          docker build \
            -t customer-support-frontend:scan \
            -f frontend/Dockerfile.frontend \
            ./frontend

      - name: 🔍 Scan RAG Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: customer-support-rag:scan
          format: sarif
          output: trivy-rag.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: 🔍 Scan API Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: customer-support-api:scan
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: 🔍 Scan Frontend Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: customer-support-frontend:scan
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: 📤 Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-rag.sarif
            trivy-api.sarif
            trivy-frontend.sarif
          if-no-files-found: ignore

  # ============================================================
  # 4. SECURITY GATE - FINAL DECISION
  # ============================================================
  security-gate:
    name: 🚦 Security Gate
    runs-on: ubuntu-latest
    needs:
      - dependency-scan
      - sast
      - container-scan
    if: always()

    steps:
      - name: 🔍 Evaluate All Security Results
        run: |
          echo "============================================================"
          echo "🚦 SECURITY GATE - Final Decision"
          echo "============================================================"
          echo ""
          echo "📊 Job Results:"
          echo "   Dependency Scan: ${{ needs.dependency-scan.result }}"
          echo "   SAST Scan:       ${{ needs.sast.result }}"
          echo "   Container Scan:  ${{ needs.container-scan.result }}"
          echo ""
          echo "============================================================"

          # ✅ Fail if any security job failed
          if [ "${{ needs.dependency-scan.result }}" != "success" ] || \
             [ "${{ needs.sast.result }}" != "success" ] || \
             [ "${{ needs.container-scan.result }}" != "success" ]; then

            echo "❌ Security checks failed."
            echo ""
            echo "🔧 Action Required:"
            echo "   1. Download the security reports from workflow artifacts"
            echo "   2. Review and fix the detected vulnerabilities"
            echo "   3. Re-run the workflow"
            exit 1
          fi

          echo "✅ All security checks passed successfully."
          echo "   - No HIGH/MEDIUM vulnerabilities found"
          echo "   - No CRITICAL/HIGH container vulnerabilities"
          echo "   - LOW severity findings are reported but do not block"

      - name: 📢 Security Summary
        if: always()
        run: |
          echo "============================================================"
          echo "📊 SECURITY SCAN SUMMARY"
          echo "============================================================"
          echo ""
          echo "✅ Python Dependencies: Checked (CRITICAL/HIGH/MEDIUM → fail)"
          echo "✅ NPM Dependencies:   Checked (HIGH/MODERATE → fail)"
          echo "✅ SAST (Bandit):      Checked (HIGH/MEDIUM → fail)"
          echo "✅ Container (Trivy):  Checked (CRITICAL/HIGH → fail)"
          echo ""
          echo "📁 Reports available as artifacts:"
          echo "   - python-security-report"
          echo "   - npm-security-report"
          echo "   - bandit-report"
          echo "   - trivy-reports"
          echo "============================================================"
