# .github/workflows/security.yml
name: 🔒 Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"

jobs:
  dependency-scan:
    name: 📦 Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🔍 Scan Python Dependencies
        uses: pypa/gh-action-pip-audit@v1
        with:
          requirements: backend/requirements.txt

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 🔍 Scan NPM Dependencies
        run: |
          cd frontend
          npm audit --production --audit-level=high

  sast:
    name: 🔍 SAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Bandit
        run: pip install bandit

      - name: 🔍 Run Bandit Security Scan
        run: |
          cd backend
          bandit -r app/ -f json -o bandit-report.json
          bandit -r app/ -f html -o bandit-report.html

      - name: 📤 Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: backend/bandit-report.*

  container-scan:
    name: 🐳 Container Scan
    runs-on: ubuntu-latest

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker Images
        run: |
          docker build -t customer-support-rag:scan -f backend/docker/Dockerfile.rag ./backend
          docker build -t customer-support-api:scan -f backend/docker/Dockerfile.backend ./backend
          docker build -t customer-support-frontend:scan -f frontend/Dockerfile.frontend ./frontend

      - name: 🔍 Scan RAG Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: customer-support-rag:scan
          format: "sarif"
          output: "trivy-rag.sarif"
          severity: "CRITICAL,HIGH"

      - name: 🔍 Scan API Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: customer-support-api:scan
          format: "sarif"
          output: "trivy-api.sarif"
          severity: "CRITICAL,HIGH"

      - name: 🔍 Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: customer-support-frontend:scan
          format: "sarif"
          output: "trivy-frontend.sarif"
          severity: "CRITICAL,HIGH"

      - name: 📤 Upload Trivy Reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-rag.sarif
            trivy-api.sarif
            trivy-frontend.sarif