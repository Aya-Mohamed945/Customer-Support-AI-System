# .github/workflows/ci.yml
# Continuous Integration Pipeline for Customer Support AI

name: CI - Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ============================================
  # BACKEND - LINTING
  # ============================================
  backend-lint:
    name: 🐍 Backend Lint
    runs-on: ubuntu-latest

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 🎨 Check Formatting with Black
        run: |
          cd backend
          black --check app/ --line-length=120

      - name: 🧹 Check Imports with isort
        run: |
          cd backend
          isort --check-only --profile black --line-length=120 app/

      - name: 🔍 Lint with Flake8
        run: |
          cd backend
          flake8 app/ --config=.flake8 --count --statistics --show-source

      - name: 🔍 Type Check with mypy
        run: |
          cd backend
          mypy app/ --config-file=pyproject.toml --ignore-missing-imports || true

      - name: 📊 Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-lint-report
          path: |
            backend/flake8-report.txt
            backend/mypy-report.txt

  # ============================================
  # BACKEND - TESTS
  # ============================================
  backend-tests:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 🧪 Run Tests with Coverage
        run: |
          cd backend
          pytest tests/ -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --maxfail=5 \
            --timeout=300

      - name: 📊 Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: 📤 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/htmlcov/
            backend/.coverage
            backend/coverage.xml

  # ============================================
  # FRONTEND - LINTING
  # ============================================
  frontend-lint:
    name: ⚛️ Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: |
          cd frontend
          npm install

      - name: 🔍 Lint with ESLint
        run: |
          cd frontend
          npm run lint -- --max-warnings=0 || true

      - name: 🔍 Type Check with TypeScript
        run: |
          cd frontend
          npx tsc --noEmit

  # ============================================
  # FRONTEND - TESTS
  # ============================================
  frontend-tests:
    name: ⚛️ Frontend Tests
    runs-on: ubuntu-latest
    needs: frontend-lint

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: 🧪 Run Frontend Tests
        run: |
          cd frontend
          npm run test -- --coverage --watchAll=false

      - name: 🔨 Build Frontend
        run: |
          cd frontend
          npm run build

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next/

      - name: 📊 Upload Frontend Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # ============================================
  # MODEL VALIDATION
  # ============================================
  model-validation:
    name: 🤖 Model Validation
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: 🔍 Validate Model Files
        run: |
          cd backend
          python -c "
          import joblib
          import os

          models = [
              'models/priority_model_final.pkl',
              'models/priority_vectorizer_final.pkl',
              'models/priority_encoder.pkl',
              'models/category_model_final.pkl',
              'models/category_vectorizer_final.pkl',
              'models/category_encoder.pkl',
              'models/sentiment_model_final.pkl',
              'models/sentiment_vectorizer_final.pkl',
              'models/sentiment_encoder.pkl'
          ]

          missing = []
          failed = []

          for model in models:
              if os.path.exists(model):
                  print(f'✅ {model} exists')
                  try:
                      joblib.load(model)
                      print(f'   ✅ {model} loads successfully')
                  except Exception as e:
                      print(f'   ❌ {model} failed to load: {e}')
                      failed.append(model)
              else:
                  print(f'❌ {model} not found')
                  missing.append(model)

          if missing or failed:
              print('❌ Model validation failed!')
              if missing:
                  print(f'   Missing: {missing}')
              if failed:
                  print(f'   Failed to load: {failed}')
              exit(1)
          else:
              print('✅ All models validated successfully!')
          "

  # ============================================
  # DOCKER BUILD
  # ============================================
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, model-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and Push RAG Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile.rag
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/customer-support-rag:latest
            ${{ secrets.DOCKER_USERNAME }}/customer-support-rag:${{ github.sha }}
            ghcr.io/${{ github.repository }}/rag:latest
            ghcr.io/${{ github.repository }}/rag:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/customer-support-api:latest
            ${{ secrets.DOCKER_USERNAME }}/customer-support-api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/customer-support-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/customer-support-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📊 Scan Docker Images with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/customer-support-api:latest
          format: "sarif"
          output: "trivy-api.sarif"
          severity: "CRITICAL,HIGH"

      - name: 📤 Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-api.sarif

  # ============================================
  # NOTIFY ON FAILURE
  # ============================================
  notify-failure:
    name: 📢 Notify Failure
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-tests, frontend-lint, frontend-tests, model-validation]
    if: failure() && github.event_name == 'push'

    steps:
      - name: 📢 Send Notification
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            try {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `❌ CI Failed on ${context.sha.substring(0, 7)}`,
                body: `The CI pipeline failed on commit ${context.sha}.\n\nPlease check the workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                labels: ['bug', 'ci-failure']
              });
              console.log(`✅ Issue created: ${issue.data.html_url}`);
            } catch (error) {
              console.log(`⚠️ Could not create issue: ${error.message}`);
              console.log(`📝 This is expected if the token lacks 'issues: write' permission.`);
            }
