# .github/workflows/ci.yml
name: CI - Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend-tests:
    name: 🐍 Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest pytest-cov flake8 black mypy isort

      - name: 🔍 Lint with Flake8
        run: |
          cd backend
          flake8 app/ --count --max-line-length=120 --statistics

      - name: 🎨 Check Formatting with Black
        run: |
          cd backend
          black --check app/

      - name: 🧹 Check Imports with isort
        run: |
          cd backend
          isort --check-only --profile black app/

      - name: 🧪 Run Tests with Coverage
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html

      - name: 📊 Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

      - name: 📤 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/htmlcov/
            backend/.coverage

  frontend-tests:
    name: ⚛️ Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: 🧪 Run Frontend Tests
        run: |
          cd frontend
          npm run test -- --coverage

      - name: 🔨 Build Frontend
        run: |
          cd frontend
          npm run build

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next/

  model-validation:
    name: 🤖 Model Validation
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install joblib numpy pandas scikit-learn

      - name: 🔍 Validate Model Files
        run: |
          cd backend
          python -c "
          import joblib
          import os
          
          models = [
              'models/priority_model_final.pkl',
              'models/priority_vectorizer_final.pkl',
              'models/priority_encoder.pkl',
              'models/category_model_final.pkl',
              'models/category_vectorizer_final.pkl',
              'models/category_encoder.pkl',
              'models/sentiment_model_final.pkl',
              'models/sentiment_vectorizer_final.pkl',
              'models/sentiment_encoder.pkl'
          ]
          
          for model in models:
              if os.path.exists(model):
                  print(f'✅ {model} exists')
                  try:
                      joblib.load(model)
                      print(f'   ✅ {model} loads successfully')
                  except Exception as e:
                      print(f'   ❌ {model} failed to load: {e}')
                      exit(1)
              else:
                  print(f'❌ {model} not found')
                  exit(1)
          "

  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, model-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 🔽 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build and Push RAG Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile.rag
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/customer-support-rag:latest
            ${{ secrets.DOCKER_USERNAME }}/customer-support-rag:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/customer-support-api:latest
            ${{ secrets.DOCKER_USERNAME }}/customer-support-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/customer-support-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/customer-support-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max