# customer-support-ai/docker-compose.yml
services:
  rag:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.rag
    container_name: customer-support-rag
    ports:
      - "8001:8001"
    volumes:
      - ./backend/models:/app/models
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - HF_HUB_ENABLE_HF_TRANSFER=0
    networks:
      - customer-support-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.backend
    container_name: customer-support-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - RAG_URL=http://rag:8001
    depends_on:
      rag:
        condition: service_healthy
    networks:
      - customer-support-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: customer-support-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
      - BACKEND_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - customer-support-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  customer-support-network:
    driver: bridge